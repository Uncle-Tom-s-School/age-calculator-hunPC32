<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
 
  <title>Frontend Mentor | Age calculator app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div id="beiras">
      <div class="day">
        <p>Day</p>
      <input type="text" name="day" id="day">
      </div>

      <div class="month">
        <p>Month</p>
      <input type="text" name="month" id="month">
      </div>

      <div class="year">
        <p>Year</p>
      <input type="text" name="year" id="year">
      </div>
    </div>

  <div id="bekuldes">
    <hr>  <button id="button" onclick="age()"><svg xmlns="http://www.w3.org/2000/svg" width="46" height="44" viewBox="0 0 46 44"><g fill="none" stroke="#FFF" stroke-width="2"><path d="M1 22.019C8.333 21.686 23 25.616 23 44M23 44V0M45 22.019C37.667 21.686 23 25.616 23 44"/></g></svg></button>
  </div>

  <div id="kiiras">
    <h2><span id="years">0</span> years</h2>
    <h2><span id="months">0</span> months</h2>
    <h2><span id="days">0</span> days</h2>
  </div>
  </div>

  <script src="age.js"></script>
</body>
</html>
